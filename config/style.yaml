# Style configuration for Nepal News Bot video generation
video:
  resolution: [1920, 1080]
  resolution_vertical: [1080, 1920]
  fps: 30
  codec: "libx264"
  pix_fmt: "yuv420p"
  crf: 20
  preset: "veryfast"
  faststart: true

preview:
  resolution: [960, 540]
  resolution_vertical: [540, 960]
  crf: 30
  preset: "ultrafast"

audio:
  codec: "aac"
  bitrate: "192k"
  sample_rate: 48000
  channels: 2

music:
  enabled: false
  volume: 0.15
  voice_duck_db: -22
  music_bed_db: -8
  fade_duration_sec: 0.25
  snap_tolerance_sec: 0.35

palette:
  navy_panel: "#0B1F3A"
  navy_panel_rgba: [11, 31, 58, 235]
  white_text: "#FFFFFF"
  amber_accent: "#F5A623"
  dark_shadow: [0, 0, 0, 128]
  test_tag_bg: [217, 83, 79, 235]
  illustrative_tag_bg: [11, 31, 58, 220]

fonts:
  primary_candidates:
    - "C:\\Windows\\Fonts\\NirmalaB.ttf"
    - "C:\\Windows\\Fonts\\segoeuib.ttf"
    - "C:\\Windows\\Fonts\\arialbd.ttf"
  regular_candidates:
    - "C:\\Windows\\Fonts\\Nirmala.ttf"
    - "C:\\Windows\\Fonts\\segoeui.ttf"
    - "C:\\Windows\\Fonts\\arial.ttf"

safe_margin_pct: 0.05

captions:
  font_family: "Segoe UI Semibold"
  size_landscape: 44
  size_vertical: 64
  max_lines: 2
  line_height_pct: 1.25
  highlight_color: "#F5A623"
  box_rgba: [7, 20, 38, 224]
  gap_from_band_px: 24

layout_rectangles:
  # Safe zone in 1920x1080 is x: 96..1824, y: 54..1026
  caption_margin_v: 105
  caption_band:
    x: 160
    y: 910
    w: 1600
    h: 100
  lower_third:
    x: 96
    y: 730
    w: 1320
    h: 155
  title_card:
    x: 260
    y: 280
    w: 1400
    h: 460
  outro_card:
    x: 260
    y: 280
    w: 1400
    h: 460
  test_run_tag:
    x: 96
    y: 54
    w: 180
    h: 44
  illustrative_tag:
    x: 1540
    y: 54
    w: 284
    h: 44
  stat_callout:
    x: 260
    y: 180
    w: 1400
    h: 520
  quote_card:
    x: 260
    y: 180
    w: 1400
    h: 520
  headline_split:
    x: 96
    y: 100
    w: 760
    h: 760
  news_ticker:
    x: 96
    y: 860
    w: 1728
    h: 44

layout_rectangles_vertical:
  # Safe zone in 1080x1920 is x: 54..1026, y: 96..1824 (calibrated for TikTok & Reels safe UI)
  caption_margin_v: 380
  caption_band:
    x: 60
    y: 1440
    w: 960
    h: 120
  lower_third:
    x: 60
    y: 1240
    w: 960
    h: 180
  title_card:
    x: 60
    y: 560
    w: 960
    h: 520
  outro_card:
    x: 60
    y: 560
    w: 960
    h: 520
  test_run_tag:
    x: 54
    y: 120
    w: 180
    h: 44
  illustrative_tag:
    x: 742
    y: 120
    w: 284
    h: 44
  stat_callout:
    x: 60
    y: 480
    w: 960
    h: 600
  quote_card:
    x: 60
    y: 480
    w: 960
    h: 600
  headline_split:
    x: 60
    y: 380
    w: 960
    h: 800
  news_ticker:
    x: 60
    y: 1380
    w: 960
    h: 50

transitions:
  scene_boundary:
    type: "dip_to_black"
    duration_sec: 0.2
    fade_out_sec: 0.1
    fade_in_sec: 0.1
  intra_scene:
    type: "cut"
  still_zoom:
    start_scale: 1.00
    end_scale: 1.08
    slow_zoom: true

watermark_test_runs: true
