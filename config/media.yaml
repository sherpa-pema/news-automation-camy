# Media Agent Configuration
version: "1.0"

settings:
  orientation: "landscape" # "landscape" (1920x1080) or "vertical" (1080x1920)
  fps: 30
  resolution: [1920, 1080]
  target_shot_sec: 7
  target_shot_duration: 7.0
  min_shot_duration: 4.0
  max_shot_duration: 10.0
  min_relevance: 0.5
  max_stills_per_scene: 2
  allow_cc_by_sa: false # most Nepal material on Commons is CC BY-SA; ShareAlike requires derivative works to carry the same license
  illustrative_label: true
  query_max_repeat: 2 # Limit shots from same query to 2 per run
  max_maps_per_run: 1 # Allow at most one map/diagram style still per run
  max_total_media_size_mb: 500
  internet_search: false # 100% manual per run: stop pulling media from internet APIs
  cache_dir: "data/media_cache"
  cache_ttl_hours: 24
  cache_max_gb: 5.0
  cache_keep_days: 7
  user_agent: "NepalNewsBot/1.0 (+https://github.com/nepal-news-bot; contact@nepalnewsbot.org)"

# File type filters: drop candidates with unsupported extensions before ranking
file_types:
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".webp"
    - ".mp4"
    - ".webm"
    - ".ogv"
    - ".mov"
  disallowed_extensions:
    - ".svg"
    - ".pdf"
    - ".tif"
    - ".tiff"
    - ".gif"

# Sources Configuration and Priority
sources:
  local_library:
    enabled: false
    priority: 1
    path: "data/media_library"
    requires_key: false

  wikimedia_commons:
    enabled: false
    priority: 2
    endpoint: "https://commons.wikimedia.org/w/api.php"
    requires_key: false
    rate_limit_per_minute: 60

  pixabay:
    enabled: true
    priority: 3
    api_key_env: "PIXABAY_API_KEY"
    requires_key: true
    videos_endpoint: "https://pixabay.com/api/videos/"
    photos_endpoint: "https://pixabay.com/api/"
    rate_limit_per_minute: 100
    safesearch: true

  coverr:
    enabled: false # Coverr terms may restrict commercial use; disabled until confirmed
    priority: 4
    api_key_env: "COVERR_API_KEY"
    requires_key: true
    endpoint: "https://api.coverr.co/videos"
    rate_limit_per_hour: 50

  openverse:
    enabled: false
    priority: 5
    token_env: "OPENVERSE_TOKEN" # Optional token raises rate limits
    requires_key: false
    endpoint: "https://api.openverse.org/v1/images/"
    rate_limit_per_minute: 60

  nasa:
    enabled: false
    priority: 6
    requires_key: false
    endpoint: "https://images-api.nasa.gov/search"
    allowed_categories:
      - "weather"
      - "climate"
      - "space"
      - "earth"

  internet_archive:
    enabled: false
    priority: 7
    requires_key: false
    endpoint: "https://archive.org/advancedsearch.php"
    metadata_endpoint: "https://archive.org/metadata"

  unsplash:
    enabled: false
    priority: 8
    api_key_env: "UNSPLASH_ACCESS_KEY"
    requires_key: true
    endpoint: "https://api.unsplash.com/search/photos"
    rate_limit_per_hour: 50

  pexels:
    enabled: false # Pexels key issuance is paused; disabled by default
    priority: 9
    api_key_env: "PEXELS_API_KEY"
    requires_key: true
    endpoint: "https://api.pexels.com/videos/search"

# yt-dlp Configuration (OFF by default)
ytdlp:
  enabled: false
  allowlisted_domains:
    - "archive.org"
    - "commons.wikimedia.org"
    - "nasa.gov"
  max_filesize_mb: 100
  rate_limit_calls_per_minute: 10

# License Policy
allowed_licenses:
  - "Pixabay Content License"
  - "Pixabay License"
  - "Pexels License"
  - "CC0"
  - "CC0 1.0"
  - "CC0 1.0 Universal"
  - "Public Domain"
  - "Public Domain Mark"
  - "PDM"
  - "CC BY"
  - "CC BY 2.0"
  - "CC BY 2.5"
  - "CC BY 3.0"
  - "CC BY 4.0"
  - "CC-BY"
  - "CC-BY-2.0"
  - "CC-BY-2.5"
  - "CC-BY-3.0"
  - "CC-BY-4.0"
  - "NASA media"
  - "NASA"
  - "Coverr License"
  - "Unsplash License"
  - "own work"
  - "user-provided"
  - "N/A" # for system/motion fallback shots

# Hard Blocklist: Never download media from news-outlet domains
blocklisted_domains:
  - "kathmandupost.com"
  - "onlinekhabar.com"
  - "setopati.com"
  - "myrepublica.nagariknetwork.com"
  - "nagariknetwork.com"
  - "thehimalayantimes.com"
  - "ekantipur.com"
  - "kantipurtv.com"
  - "ratopati.com"
  - "nepalitimes.com"
  - "annapurnapost.com"
  - "republica.nagariknetwork.com"
  - "himalayantimes.com"

# Category Defaults for Query Ladder fallback
category_defaults:
  politics: "government building"
  economy: "market street"
  weather: "monsoon rain"
  climate: "monsoon rain"
  health: "hospital corridor"
  transport: "highway traffic"
  energy: "hydroelectric power plant"
  tourism: "mountain landscape"
  commerce: "cargo port shipping"
  environment: "river cleanup water"
  general: "Kathmandu city skyline"

# Sensitive Scene Detection & Content Filtering
sensitive_keywords:
  - "crime"
  - "murder"
  - "assault"
  - "arrest"
  - "accident"
  - "crash"
  - "casualty"
  - "fatal"
  - "death"
  - "died"
  - "killed"
  - "disaster"
  - "flood casualty"
  - "earthquake victim"
  - "abuse"
  - "minor"
  - "rape"
  - "victim"
  - "violence"

# Disallowed tags in sensitive scenes (only non-human / abstract visuals permitted)
sensitive_scene_person_tags:
  - "person"
  - "people"
  - "man"
  - "men"
  - "woman"
  - "women"
  - "child"
  - "children"
  - "crowd"
  - "face"
  - "human"
  - "portrait"
  - "girl"
  - "boy"
  - "tourist"
  - "worker"
  - "volunteer"

# Disallowed media with watermarks/logos
watermark_markers:
  - "watermark"
  - "logo"
  - "brand"
  - "trademark"
  - "copyright"
  - "insignia"

# AI Markers for Coverr and other sources
ai_markers:
  - "ai"
  - "artificial intelligence"
  - "midjourney"
  - "sora"
  - "stable diffusion"
  - "runway"
  - "generated"
  - "cgen"
  - "ai-generated"

# Foreign Place Penalty list: penalize candidates mentioning these if story text does not mention them
foreign_places:
  - "india"
  - "indian"
  - "delhi"
  - "mumbai"
  - "himachal"
  - "kinnaur"
  - "sikkim"
  - "tibet"
  - "china"
  - "pakistan"
  - "bangladesh"
  - "sri lanka"
  - "uttarakhand"
  - "ladakh"
  - "kashmir"
  - "kolkata"

