version: "1.0"
execution:
  runs_dir: "data/runs"
  default_retries: 2
  allow_parallel: true

stages:
  - id: "scraper"
    agent: "ScraperAgent"
    depends_on: []
    retries: 2
    timeout_seconds: 180
    min_articles: 5
    inputs:
      - "config/sources.yaml"
    outputs:
      - "raw/articles.json"
      - "raw/news.md"
    tool: "feedparser + requests + trafilatura"
    notes: "Fetches RSS feeds from verified outlets, parses articles with polite delay."

  - id: "editor"
    agent: "EditorAgent"
    depends_on: ["scraper"]
    retries: 2
    timeout_seconds: 120
    inputs:
      - "raw/articles.json"
    outputs:
      - "script.json"
    model: "TODO: LLM for broadcast rewriting (e.g. Gemini 1.5 Pro / Claude 3.5 Sonnet / Llama 3)"
    notes: "Selects top 5 stories, dedupes, rewrites into broadcast narration with source credits."

  - id: "voice"
    agent: "VoiceAgent"
    depends_on: ["editor"]
    can_run_parallel_with: ["media"]
    retries: 2
    timeout_seconds: 300
    inputs:
      - "script.json"
    outputs:
      - "audio/narration.wav"
    model: "TODO: Open-source TTS (e.g. Kokoro-82M / Piper / Bark / Coqui XTTS-v2)"
    notes: "Synthesizes clear broadcast narration audio."

  - id: "media"
    agent: "MediaAgent"
    depends_on: ["editor"]
    can_run_parallel_with: ["voice", "timeline"]
    retries: 2
    timeout_seconds: 300
    inputs:
      - "script.json"
    outputs:
      - "media_manifest.json"
    tool: "Free/licensed media APIs (Pexels, Pixabay, Wikimedia Commons) + yt-dlp (CC license only)"
    notes: "Collects verified public domain / CC visuals. Strictly avoids news-outlet media."

  - id: "timeline"
    agent: "TimelineAgent"
    depends_on: ["voice"]
    can_run_parallel_with: ["media"]
    retries: 2
    timeout_seconds: 180
    inputs:
      - "audio/narration.wav"
      - "script.json"
    outputs:
      - "timeline.json"
      - "captions.srt"
    tool: "TODO: Forced alignment / ASR (e.g. whisper-timestamped / gentle / CTC-segmentation)"
    notes: "Extracts word-level and scene-level timestamps from narration audio."

  - id: "motion"
    agent: "MotionAgent"
    depends_on: ["timeline", "media"]
    retries: 2
    timeout_seconds: 120
    inputs:
      - "timeline.json"
      - "media_manifest.json"
      - "script.json"
    outputs:
      - "render_plan.json"
    model: "TODO: LLM / Design Rule Engine (Remotion/HTML5/FFmpeg motion templates)"
    notes: "Composes scene layouts, lower-thirds, captions, source tags, and transitions."

  - id: "render"
    agent: "RenderAgent"
    depends_on: ["motion", "media", "voice", "timeline"]
    retries: 2
    timeout_seconds: 600
    inputs:
      - "render_plan.json"
      - "timeline.json"
      - "media_manifest.json"
      - "audio/narration.wav"
      - "captions.srt"
    outputs:
      - "final.mp4"
    tool: "ffmpeg"
    notes: "Stitches media, narration, overlays, and captions into final MP4 video."

  - id: "qa"
    agent: "QAAgent"
    depends_on: ["render"]
    retries: 2
    timeout_seconds: 120
    inputs:
      - "final.mp4"
      - "audio/narration.wav"
      - "timeline.json"
      - "captions.srt"
      - "media_manifest.json"
      - "script.json"
    outputs:
      - "qa_report.json"
    tool: "ffprobe + python automated checks"
    notes: "Validates duration sync, loudness, black frames, attribution, and returns pass/fail."
