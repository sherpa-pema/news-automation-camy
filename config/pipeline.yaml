version: "1.0"
execution:
  runs_dir: "data/runs"
  default_retries: 2
  allow_parallel: true

stages:
  - id: "scraper"
    agent: "ScraperAgent"
    depends_on: []
    retries: 2
    timeout_seconds: 180
    min_articles: 5
    inputs:
      - "config/sources.yaml"
    outputs:
      - "raw/articles.json"
      - "raw/news.md"
    tool: "feedparser + requests + trafilatura"
    notes: "Fetches RSS feeds from verified outlets, parses articles with polite delay."

  - id: "editor"
    agent: "EditorAgent"
    depends_on: ["scraper"]
    retries: 2
    timeout_seconds: 120
    inputs:
      - "raw/articles.json"
    outputs:
      - "script.json"
    model: "TODO: LLM for broadcast rewriting (e.g. Gemini 1.5 Pro / Claude 3.5 Sonnet / Llama 3)"
    notes: "Selects top 5 stories, dedupes, rewrites into broadcast narration with source credits."

  - id: "voice"
    agent: "VoiceAgent"
    depends_on: ["editor"]
    can_run_parallel_with: ["media"]
    retries: 2
    timeout_seconds: 3600
    inputs:
      - "script.json"
    outputs:
      - "audio/narration.wav"
      - "audio/scene_durations.json"
      - "audio/voice_report.json"
    engine: "ming"
    model_path: "models/Ming-3.0-tts-0.5b"
    task: "TTS"
    voice: "NP_lemi"
    reference_wav: "config/voice/reference.wav"
    reference_txt: "config/voice/reference.txt"
    use_spk_emb: true
    use_zero_spk_emb: false
    chunk_mode: "scene"
    similarity_threshold: 0.72
    f0_tolerance_pct: 0.25
    max_retries: 2
    language_id: "en"
    instruction_schema: "en"
    device: "cuda:0"
    dtype: "bfloat16"
    subprocess_python: ".venv-tts/Scripts/python.exe"
    worker_timeout_sec: 3600
    pause_between_sentences: 0.25
    pad_before: 0.4
    pad_after: 0.6
    target_lufs: -16
    output_sample_rate: 48000
    text_normalization: false
    disclose_synthetic_voice: true
    notes: "Synthesizes broadcast narration audio using Ming-3.0-tts zero-shot cloning anchored to config/voice/reference.wav."

  - id: "media"
    agent: "MediaAgent"
    depends_on: ["editor"]
    can_run_parallel_with: ["voice", "timeline"]
    retries: 2
    timeout_seconds: 300
    inputs:
      - "script.json"
    outputs:
      - "media_manifest.json"
    tool: "Free/licensed media APIs (Pexels, Pixabay, Wikimedia Commons) + yt-dlp (CC license only)"
    notes: "Collects verified public domain / CC visuals. Strictly avoids news-outlet media."

  - id: "timeline"
    agent: "TimelineAgent"
    depends_on: ["voice"]
    can_run_parallel_with: ["media"]
    retries: 2
    timeout_seconds: 300
    inputs:
      - "audio/narration.wav"
      - "audio/scene_durations.json"
      - "script.json"
    outputs:
      - "timeline/timeline.json"
      - "timeline/captions.srt"
      - "timeline/captions.json"
      - "timeline/timeline_preview.mp4"
      - "timeline.json"
      - "captions.srt"
    aligner: "mms_fa"
    model_path: "models/MMS_FA/model.pt"
    device: "cuda:0"
    dtype: "float32"
    subprocess_python: ".venv-tts/Scripts/python.exe"
    worker_script: "tools/timeline_worker.py"
    worker_timeout_sec: 300
    low_score_threshold: 0.35
    max_unplaced_scene_ratio: 0.15
    max_unplaced_total_ratio: 0.05
    min_wps: 1.2
    max_wps: 6.0
    max_chars_per_line: 42
    max_lines: 2
    min_duration_sec: 0.9
    max_duration_sec: 5.0
    lead_in_sec: 0.05
    hold_after_sec: 0.15
    min_gap_sec: 0.04
    tool: "torchaudio MMS_FA forced aligner"
    notes: "Extracts word-level and scene-level timestamps from narration audio using MMS_FA forced aligner."

  - id: "motion"
    agent: "MotionAgent"
    depends_on: ["timeline", "media"]
    retries: 2
    timeout_seconds: 120
    inputs:
      - "timeline.json"
      - "media_manifest.json"
      - "script.json"
    outputs:
      - "render_plan.json"
    model: "TODO: LLM / Design Rule Engine (Remotion/HTML5/FFmpeg motion templates)"
    notes: "Composes scene layouts, lower-thirds, captions, source tags, and transitions."

  - id: "render"
    agent: "RenderAgent"
    depends_on: ["motion", "media", "voice", "timeline"]
    retries: 2
    timeout_seconds: 600
    inputs:
      - "render_plan.json"
      - "timeline.json"
      - "media_manifest.json"
      - "audio/narration.wav"
      - "captions.srt"
    outputs:
      - "final.mp4"
    tool: "ffmpeg"
    notes: "Stitches media, narration, overlays, and captions into final MP4 video."

  - id: "qa"
    agent: "QAAgent"
    depends_on: ["render"]
    retries: 2
    timeout_seconds: 120
    inputs:
      - "final.mp4"
      - "audio/narration.wav"
      - "timeline.json"
      - "captions.srt"
      - "media_manifest.json"
      - "script.json"
    outputs:
      - "qa_report.json"
    tool: "ffprobe + python automated checks"
    notes: "Validates duration sync, loudness, black frames, attribution, and returns pass/fail."
