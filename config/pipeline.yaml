version: "1.0"
execution:
  runs_dir: "data/runs"
  default_retries: 2
  allow_parallel: true
  default_run_kind: "test"
  keep_runs: 14

outputs:
  mirror_dir: "~/OneDrive/NepalNewsBot/latest"

notifications:
  enabled: true
  timeout_seconds: 5
  default_web_office_url: "http://127.0.0.1:8000"

stages:
  - id: "scraper"
    agent: "ScraperAgent"
    depends_on: []
    retries: 2
    timeout_seconds: 180
    budget_seconds: 150
    min_articles: 6
    min_eligible_articles: 6
    degraded_floor: 3
    degradation_lookback_hours: 48
    inputs:
      - "config/sources.yaml"
    outputs:
      - "raw/articles.json"
      - "raw/news.md"
    tool: "feedparser + requests + trafilatura"
    notes: "Fetches RSS feeds from verified outlets, parses articles with polite delay."

  - id: "editor"
    agent: "EditorAgent"
    depends_on: ["scraper"]
    retries: 2
    timeout_seconds: 120
    inputs:
      - "raw/articles.json"
    outputs:
      - "script/script.json"
    model: "TODO: LLM for broadcast rewriting (e.g. Gemini 1.5 Pro / Claude 3.5 Sonnet / Llama 3)"
    notes: "Selects top 5 stories, dedupes, rewrites into broadcast narration with source credits."

  - id: "voice"
    agent: "VoiceAgent"
    depends_on: ["editor"]
    retries: 2
    timeout_seconds: 3600
    inputs:
      - "script/script.json"
    outputs:
      - "audio/narration.wav"
      - "audio/scene_durations.json"
      - "audio/voice_report.json"
    engine: "ming"
    model_path: "models/Ming-3.0-tts-0.5b"
    task: "TTS"
    voice: "female_broadcast"
    reference_wav: "config/voice/reference.wav"
    reference_txt: "config/voice/reference.txt"
    use_spk_emb: true
    use_zero_spk_emb: false
    chunk_mode: "scene"
    similarity_threshold: 0.72
    f0_tolerance_pct: 0.15
    n_candidates: 1
    f0_anchor: "running_median"
    ranker_weights:
      cosine: 1.0
      f0: 0.6
      duration: 0.2
      artifacts: 0.2
    base_seed: 1895
    max_retries: 2
    language_id: "en"
    instruction_schema: "en"
    device: "cuda:0"
    dtype: "bfloat16"
    daemon_url: "http://127.0.0.1:8766"
    batching: 4
    subprocess_python: ".venv-tts/Scripts/python.exe"
    worker_timeout_sec: 3600
    pause_between_sentences: 0.25
    padding_policy: "broadcast"
    pad_before: 0.4
    pad_after: 0.6
    cfg: 2.0
    sigma: 0.25
    temperature: 0.0
    max_length: 48
    crossfade_ms: 25.0
    target_scene_rms_dbfs: -23.0
    loudness_strategy: "fallback"
    limiter_ceiling_dbfs: -1.5
    highpass_hz: 80.0
    target_lufs: -16
    min_duration_sec: 60.0
    max_duration_sec: 240.0
    output_sample_rate: 48000
    text_normalization: false
    disclose_synthetic_voice: true
    notes: "Synthesizes broadcast narration audio using Ming-3.0-tts zero-shot cloning anchored to config/voice/reference.wav."

  - id: "media"
    agent: "MediaAgent"
    depends_on: ["timeline", "editor"]
    retries: 2
    timeout_seconds: 300
    fps: 30
    orientation: "landscape"
    resolution: [1920, 1080]
    inputs:
      - "script/script.json"
      - "timeline.json"
    outputs:
      - "media/media_manifest.json"
      - "media/credits.md"
      - "media/shot_plan.json"
    tool: "Free/licensed media APIs (Local Library, Wikimedia, Pixabay, Openverse, NASA) + ffmpeg"
    notes: "Collects verified public domain / CC visuals. Strictly avoids news-outlet media."

  - id: "timeline"
    agent: "TimelineAgent"
    depends_on: ["voice"]
    retries: 2
    timeout_seconds: 300
    inputs:
      - "audio/narration.wav"
      - "audio/scene_durations.json"
      - "script/script.json"
    outputs:
      - "timeline/timeline.json"
      - "timeline/captions.srt"
      - "timeline/captions.json"
      - "timeline/timeline_preview.mp4"
      - "timeline.json"
      - "captions.srt"
    aligner: "mms_fa"
    model_path: "models/MMS_FA/model.pt"
    device: "cpu"
    dtype: "float32"
    subprocess_python: ".venv-tts/Scripts/python.exe"
    worker_script: "tools/timeline_worker.py"
    worker_timeout_sec: 300
    low_score_threshold: 0.35
    max_unplaced_scene_ratio: 0.15
    max_unplaced_total_ratio: 0.05
    max_low_score_total_ratio: 0.15
    min_wps: 1.2
    max_wps: 6.0
    max_chars_per_line: 42
    max_lines: 2
    min_duration_sec: 0.9
    max_duration_sec: 5.0
    lead_in_sec: 0.05
    hold_after_sec: 0.15
    min_gap_sec: 0.04
    target_cps: 17.0
    max_cps: 24.0
    use_cache: true
    preview_enabled: true
    preview_fps: 10
    preview_preset: "veryfast"
    tool: "torchaudio MMS_FA forced aligner"
    notes: "Extracts word-level and scene-level timestamps from narration audio using MMS_FA forced aligner."

  - id: "motion"
    agent: "MotionAgent"
    depends_on: ["timeline", "media"]
    retries: 2
    timeout_seconds: 180
    inputs:
      - "timeline/timeline.json"
      - "timeline/captions.json"
      - "media/media_manifest.json"
      - "script/script.json"
    outputs:
      - "motion/render_plan.json"
      - "motion/captions.ass"
    notes: "Composes scene layouts, lower-thirds, captions, source tags, and transitions."

  - id: "render"
    agent: "RenderAgent"
    depends_on: ["motion"]
    retries: 2
    timeout_seconds: 1800
    inputs:
      - "motion/render_plan.json"
      - "motion/captions.ass"
      - "audio/narration.wav"
    outputs:
      - "render/final.mp4"
      - "render/description.md"
    tool: "ffmpeg"
    notes: "Stitches media, narration, overlays, and captions into final MP4 video."

  - id: "qa"
    agent: "QAAgent"
    depends_on: ["render"]
    retries: 0
    timeout_seconds: 180
    allow_degraded_timeline: true
    allow_soft_captions: true
    max_cps_threshold: 26.0
    max_late_ms_threshold: 100.0
    inputs:
      - "render/final.mp4"
      - "audio/narration.wav"
      - "motion/render_plan.json"
      - "render/description.md"
    outputs:
      - "qa/qa_report.json"
      - "qa/contact_sheet.jpg"
      - "qa/storyboard.html"
    tool: "ffprobe + python automated checks"
    notes: "Validates duration sync, loudness, black frames, attribution, and returns pass/fail."
