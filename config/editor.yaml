# Editor Agent configuration

allow_opinion: false
allow_stale_preview: false
auto_approve_test_runs: false

clustering:
  min_full_text_words: 60
  title_similarity_threshold: 0.55
  token_overlap_threshold: 0.35
  top_clusters_limit: 24
  clusters_per_category: 4

budget:
  min_duration_sec: 120.0
  max_duration_sec: 180.0
  target_duration_sec: 150.0
  default_words_per_sec: 2.15
  tolerance_pct: 0.10
  scenes:
    intro_min_words: 12
    intro_max_words: 25
    story_min_words: 10
    story_max_words: 25
    outro_min_words: 12
    outro_max_words: 25

broadcast_sequence:
  - id: "scene_01"
    category: "national_politics"
    title: "National Politics"
    aliases: ["national_politics", "politics", "political", "government", "parliament"]
  - id: "scene_02"
    category: "society_local"
    title: "Society and Local News"
    aliases: ["society_local", "society", "local", "education", "health", "transport", "disaster", "crime", "international", "world"]
  - id: "scene_03"
    category: "culture_entertainment"
    title: "Culture and Entertainment"
    aliases: ["culture_entertainment", "culture", "entertainment", "heritage", "festival", "arts"]
  - id: "scene_04"
    category: "business_economics"
    title: "Business and Economics"
    aliases: ["business_economics", "economy", "business", "market", "finance", "trade"]
  - id: "scene_05"
    category: "science_technology"
    title: "Science and Technology"
    aliases: ["science_technology", "technology", "science", "digital", "telecom", "cyber"]
  - id: "scene_06"
    category: "sports"
    title: "Sports"
    aliases: ["sports", "sport", "cricket", "football", "athletics"]

