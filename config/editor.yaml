# Editor Agent configuration

allow_opinion: false
allow_stale_preview: false

clustering:
  min_full_text_words: 60
  title_similarity_threshold: 0.55
  token_overlap_threshold: 0.35
  top_clusters_limit: 12

budget:
  min_duration_sec: 120.0
  max_duration_sec: 180.0
  target_duration_sec: 150.0
  default_words_per_sec: 2.15
  tolerance_pct: 0.10
  scenes:
    intro_min_words: 15
    intro_max_words: 40
    story_min_words: 20
    story_max_words: 60
    outro_min_words: 15
    outro_max_words: 40

sensitive_triggers:
  - "death"
  - "dead"
  - "killed"
  - "die"
  - "died"
  - "fatal"
  - "fatality"
  - "casualty"
